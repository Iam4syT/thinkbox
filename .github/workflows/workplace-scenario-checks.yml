name: Workplace scenario checks
on:
  push:
    paths:
      - 'Modern Workplace Solutions/Enterprise-Copilot-Governance-Ops/scenarios/read-access-gate/**'
      - 'Modern Workplace Solutions/access-lifecycle-review/scenarios/approved-change-plan/**'
      - '.github/workflows/workplace-scenario-checks.yml'
  pull_request:
    paths:
      - 'Modern Workplace Solutions/Enterprise-Copilot-Governance-Ops/scenarios/read-access-gate/**'
      - 'Modern Workplace Solutions/access-lifecycle-review/scenarios/approved-change-plan/**'
      - '.github/workflows/workplace-scenario-checks.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project:
          - 'Modern Workplace Solutions/Enterprise-Copilot-Governance-Ops/scenarios/read-access-gate'
          - 'Modern Workplace Solutions/access-lifecycle-review/scenarios/approved-change-plan'
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/main.py
