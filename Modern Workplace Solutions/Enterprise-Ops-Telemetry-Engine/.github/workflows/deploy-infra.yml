name: Enterprise Infrastructure & Code Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn flake8

    - name: Lint Code Base with Flake8 (Syntax check)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/Analytics/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Machine Learning Pipeline Check
      run: |
        python src/Analytics/LogParser.py
        python src/Analytics/anomalous_noise_detector.py
