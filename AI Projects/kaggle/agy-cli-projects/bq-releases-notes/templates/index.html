<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BigQuery Release Notes</title>
  <meta name="description" content="Browse and share the latest Google BigQuery release notes. Filter by category and tweet updates directly." />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
</head>
<body>

<div class="app-wrapper">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <div class="bq-logo" aria-hidden="true">📦</div>
      <div class="header-text">
        <h1>BigQuery Release Notes</h1>
        <p>Live feed from Google Cloud Docs · Updated automatically</p>
      </div>
    </div>
    <button id="refresh-btn" aria-label="Refresh release notes">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path d="M23 4v6h-6"/>
        <path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Refresh
    </button>
  </header>

  <!-- ── Status bar ──────────────────────────────────────── -->
  <div id="status-bar" role="status" aria-live="polite">
    <span id="status-dot" class="dot" aria-hidden="true"></span>
    <span id="status-text">Initialising…</span>
  </div>

  <!-- ── Filter chips ────────────────────────────────────── -->
  <div id="filter-bar" role="group" aria-label="Filter by category"></div>

  <!-- ── Entries ─────────────────────────────────────────── -->
  <main id="entries-container" aria-label="Release notes entries">
    <div class="state-box">
      <div class="state-icon">⟳</div>
      <p>Loading…</p>
    </div>
  </main>

</div><!-- /.app-wrapper -->

<!-- ── Tweet Modal ─────────────────────────────────────────── -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-heading">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        Compose Tweet
      </div>
      <button class="modal-close" id="modal-close" aria-label="Close tweet modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <textarea
      id="tweet-textarea"
      maxlength="400"
      placeholder="Edit your tweet…"
      aria-label="Tweet text"
    ></textarea>

    <div class="tweet-meta">
      <span id="char-count" aria-live="polite">0 / 280</span>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" id="cancel-btn">Cancel</button>
      <button class="btn-tweet" id="tweet-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        Post to X
      </button>
    </div>
  </div>
</div>

<script src="/static/main.js"></script>
</body>
</html>
